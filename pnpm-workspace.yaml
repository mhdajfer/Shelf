packages:
  - apps/*
  - packages/*

# Postinstall scripts are opt-in. These are build-toolchain packages that fetch
# or compile a platform binary; nothing else is allowed to run scripts.
allowBuilds:
  '@google/genai': true
  '@scarf/scarf': false
  '@tailwindcss/oxide': true
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

# Toolchain versions live here so every package resolves the same compiler,
# linter, and test runner. TypeScript stays on 5.9: typescript-eslint 8 declares
# `typescript: >=4.8.4 <6.1.0`, so TypeScript 7 would silently lose type-aware
# linting. Revisit when typescript-eslint supports it.
# drizzle-kit reaches esbuild 0.18 through the deprecated @esbuild-kit loader,
# which carries GHSA-67mh-4wv8-2f99. Dev-only and about esbuild's dev server,
# which nothing here runs, but the fix costs nothing.
overrides:
  esbuild: '>=0.25.0'

catalog:
  '@types/node': ^24.19.0
  diff: ^9.0.0
  eslint: ^10.11.0
  prettier: ^3.9.9
  react: ^19.3.0
  react-dom: ^19.3.0
  rimraf: ^6.1.3
  typescript: ~5.9.3
  vitest: ^5.0.3
  zod: ^4.6.5

minimumReleaseAgeExclude:
  - '@google/genai@2.25.0'
  - '@next/env@16.3.8'
  - '@next/swc-darwin-arm64@16.3.8'
  - '@next/swc-darwin-x64@16.3.8'
  - '@next/swc-linux-arm64-gnu@16.3.8'
  - '@next/swc-linux-arm64-musl@16.3.8'
  - '@next/swc-linux-x64-gnu@16.3.8'
  - '@next/swc-linux-x64-musl@16.3.8'
  - '@next/swc-win32-arm64-msvc@16.3.8'
  - '@next/swc-win32-x64-msvc@16.3.8'
  - '@turbo/darwin-64@2.11.6'
  - '@turbo/darwin-arm64@2.11.6'
  - '@turbo/linux-64@2.11.6'
  - '@turbo/linux-arm64@2.11.6'
  - '@turbo/windows-64@2.11.6'
  - '@turbo/windows-arm64@2.11.6'
  - dotenv@18.0.5
  - globals@17.13.0
  - next@16.3.8
  - pg-cloudflare@1.4.1
  - pg-connection-string@2.14.1
  - pg-protocol@1.16.1
  - pg@8.23.1
  - turbo@2.11.6

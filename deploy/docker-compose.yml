# The whole app on one server: Caddy in front, the web app and the API behind
# it on one hostname, Postgres and Redis beside them. Nothing but Caddy is
# reachable from outside.
#
#   cp .env.example .env    # then fill it in
#   docker compose up -d --build
#
# One hostname means one origin: the browser calls /api on the same host, so
# the session cookie is host-only and COOKIE_DOMAIN stays unset.
name: shelf

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      SITE_HOST: ${SITE_HOST:?set SITE_HOST in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
      - api

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        PUBLIC_WEB_URL: https://${SITE_HOST}
        PUBLIC_API_URL: https://${SITE_HOST}
        API_INTERNAL_URL: http://api:4000
        TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    # Optional keys (Gemini, Resend, Google, Turnstile, ADMIN_EMAILS) are read
    # from .env only when they are set there; an empty value is not "unset".
    env_file: .env
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      API_PORT: 4000
      PUBLIC_WEB_URL: https://${SITE_HOST}
      PUBLIC_API_URL: https://${SITE_HOST}
      CORS_ALLOWED_ORIGINS: https://${SITE_HOST}
      DATABASE_URL: postgresql://shelf:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/shelf
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shelf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: shelf
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shelf -d shelf']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  redis-data:
